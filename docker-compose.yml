services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: ai_lawyer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev  # local dev only; never exposed beyond localhost
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/docker; mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_lawyer"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:8
    # Job dispatch only (docs/design.md → Job queue): AOF on, never evict — a full Redis rejects enqueues loudly.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "256mb",
              "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
  redisdata:
