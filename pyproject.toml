[project]
name = "ontario-injury-guide"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-genai",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
