[project]
name = "ontario-injury-guide"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai",
    "langfuse>=4.15.6",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "redis>=8.1.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
